name: R syntax check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Parse all workflow scripts
        shell: Rscript {0}
        run: |
          scripts <- c(
            list.files("BCC_Scripts", pattern = "[.]R$", full.names = TRUE),
            list.files("NSCLC_Scripts", pattern = "[.]R$", full.names = TRUE),
            "scripts/validate.R"
          )
          for (script in scripts) {
            message("Parsing ", script)
            parse(file = script)
          }
